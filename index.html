<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goal Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#14232b;--muted:#6b7c85;--line:#d5dee3;--accent:#0f766e;--warn:#b45309;--radius:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a20;--card:#17262e;--ink:#e6eef1;--muted:#8fa3ad;--line:#2a3d47;--accent:#2dd4bf;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:2rem;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 24px}
input,button{font:inherit;color:inherit}
input[type=text],input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:8px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.add-goal{display:flex;gap:8px;margin-bottom:28px}
.add-goal input{flex:1}
.goal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.goal-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.goal-head h2{margin:0;font-size:1.25rem;font-weight:600}
.count{color:var(--muted);font-size:.9rem;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.done-badge{color:var(--accent);font-weight:600}
.ms{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.ms:first-of-type{border-top:0}
.ms input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.ms .date{width:150px;flex:none;padding:5px 8px}
.ms .text{flex:1}
.ms.done .text{text-decoration:line-through;color:var(--muted)}
.ms.late .date{color:var(--warn);border-color:var(--warn)}
.x{border:0;background:none;color:var(--muted);padding:4px 8px;font-size:1.1rem;line-height:1}
.x:hover{color:var(--warn)}
.foot{display:flex;justify-content:space-between;margin-top:10px}
.link{border:0;background:none;padding:4px 0;color:var(--accent);font-weight:600}
.link.danger{color:var(--muted);font-weight:400}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-top:32px}
@media(max-width:520px){.ms{flex-wrap:wrap}.ms .text{flex-basis:calc(100% - 80px)}.ms .date{width:auto}}
</style>
</head>
<body>
<main>
  <h1>Goal Tracker</h1>
  <p class="sub">Add a certification or career goal, then break it into dated steps.</p>

  <form class="add-goal" id="goalForm">
    <input type="text" id="goalName" placeholder="New goal, e.g. CompTIA A+" aria-label="Goal name" required>
    <button class="primary">Add goal</button>
  </form>

  <div id="goals"></div>

  <div class="tools">
    <button id="export">Export backup</button>
    <button id="import">Import backup</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</main>

<script>
const KEY = "goalTracker.v1";
let goals = load();

function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(goals)); } catch {}
}
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);

function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  Object.assign(e, props);
  kids.forEach(k => e.append(k));
  return e;
}

function render(){
  const root = document.getElementById("goals");
  root.replaceChildren();
  if(!goals.length){
    root.append(el("div", {className:"empty", textContent:"No goals yet. Type one above to get started."}));
    return;
  }
  goals.forEach(g => root.append(renderGoal(g)));
}

function renderGoal(g){
  const done = g.steps.filter(s => s.done).length;
  const total = g.steps.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const card = el("section", {className:"goal"});
  card.dataset.g = g.id;

  const head = el("div", {className:"goal-head"},
    el("h2", {textContent:g.name}),
    el("span", {className:"count" + (total && done === total ? " done-badge" : ""),
      textContent: total ? (done === total ? "Complete" : `${done} of ${total} done`) : "No steps yet"}));
  const bar = el("div", {className:"bar"}, el("i", {style:`width:${pct}%`}));
  card.append(head, bar);

  g.steps.forEach(s => {
    const row = el("div", {className:"ms" + (s.done ? " done" : "") + (!s.done && s.date && s.date < today() ? " late" : "")});
    row.dataset.s = s.id;
    const cb = el("input", {type:"checkbox", checked:s.done}); cb.dataset.a = "toggle"; cb.setAttribute("aria-label","Mark complete");
    const date = el("input", {type:"date", className:"date", value:s.date}); date.dataset.a = "date";
    const text = el("input", {type:"text", className:"text", value:s.text, placeholder:"What needs to happen?"}); text.dataset.a = "text";
    const del = el("button", {className:"x", textContent:"×", title:"Remove step"}); del.dataset.a = "delStep"; del.setAttribute("aria-label","Remove step");
    row.append(cb, date, text, del);
    card.append(row);
  });

  const add = el("button", {className:"link", textContent:"+ Add step"}); add.dataset.a = "addStep";
  const rm = el("button", {className:"link danger", textContent:"Delete goal"}); rm.dataset.a = "delGoal";
  card.append(el("div", {className:"foot"}, add, rm));
  return card;
}

const find = e => {
  const card = e.target.closest("[data-g]");
  if(!card) return {};
  const g = goals.find(x => x.id === card.dataset.g);
  const row = e.target.closest("[data-s]");
  return {g, s: row && g ? g.steps.find(x => x.id === row.dataset.s) : null};
};

document.getElementById("goalForm").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("goalName");
  const name = input.value.trim();
  if(!name) return;
  goals.push({id:uid(), name, steps:[{id:uid(), date:"", text:"", done:false}]});
  input.value = "";
  save(); render();
});

document.getElementById("goals").addEventListener("click", e => {
  const a = e.target.dataset.a;
  const {g, s} = find(e);
  if(!g || !a) return;
  if(a === "addStep"){ g.steps.push({id:uid(), date:"", text:"", done:false}); }
  else if(a === "delStep"){ g.steps = g.steps.filter(x => x !== s); }
  else if(a === "delGoal"){ if(!confirm(`Delete "${g.name}" and all its steps?`)) return; goals = goals.filter(x => x !== g); }
  else return;
  save(); render();
});

document.getElementById("goals").addEventListener("change", e => {
  const a = e.target.dataset.a;
  const {g, s} = find(e);
  if(!g || !s) return;
  if(a === "toggle") s.done = e.target.checked;
  else if(a === "date") s.date = e.target.value;
  else if(a === "text") s.text = e.target.value;
  else return;
  save(); render();
});

document.getElementById("export").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(goals, null, 2)], {type:"application/json"}));
  const a = el("a", {href:url, download:`goal-tracker-${today()}.json`});
  a.click(); URL.revokeObjectURL(url);
});
document.getElementById("import").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  try {
    const data = JSON.parse(await f.text());
    if(!Array.isArray(data)) throw 0;
    if(confirm("Replace your current goals with this backup?")){ goals = data; save(); render(); }
  } catch { alert("That file isn't a valid backup."); }
  e.target.value = "";
});

render();
</script>
</body>
</html>
